<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rostra Debate Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-layout">
        <header class="site-header">
            <div class="title-block">
                <p class="eyebrow">Retro Rostra</p>
                <div class="main-title">Rostra Debate Dashboard</div>
            </div>
            <div class="toolbar">
                <div class="reset">
                    <button class="btn-primary" onclick="resetAll()">Reset All</button>
                </div>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- 1. PARTICIPANT NAMES SECTION -->
            <div class="participants-section panel draggable" data-section="participants">
                <div class="drag-handle">⋮⋮</div>
                <div class="participants-display">
                    <span id="aff-name-display">Affirmative</span> <span class="vs-label">vs.</span> <span id="neg-name-display">Negative</span>
                </div>
                <div class="participants-label">Affirmative 🏛️ | Negative ⚔️</div>
                <div class="participants-input-row">
                    <input type="text" id="aff-name" class="participant-input" placeholder="Affirmative Name">
                    <span class="vs-label vs-quiet">vs.</span>
                    <input type="text" id="neg-name" class="participant-input" placeholder="Negative Name">
                </div>
            </div>

            <div class="resolution panel empty draggable" contenteditable="true" id="resolution-box" data-placeholder="TYPE DEBATE RESOLUTION HERE" data-section="resolution">
                <div class="drag-handle">⋮⋮</div>
            </div>

            <!-- 3. DEBATE STAGE SECTION -->
            <div class="debate-stage-section panel draggable" data-section="debate-stage">
                <div class="drag-handle">⋮⋮</div>
                <div class="stage-header">Debate Stages</div>
                <div class="stage-controls">
                    <button id="stage-back" class="btn-primary" onclick="changeStage(-1)">&#8593; Back</button>
                    <button id="stage-forward" class="btn-primary" onclick="changeStage(1)">Forward &#8595;</button>
                </div>
                <ol class="stage-list" id="stage-list">
                    <!-- Stages will be rendered here -->
                </ol>
            </div>

            <div class="timer panel draggable" data-section="timer">
                <div class="drag-handle">⋮⋮</div>
                <div class="timer-input-row">
                    <input type="number" class="timer-input" min="0" placeholder="Min" id="timer-min">
                    <span>:</span>
                    <input type="number" class="timer-input" min="0" max="55" step="5" placeholder="Sec" id="timer-sec">
                </div>
                <div class="timer-actions">
                    <button class="btn-primary" onclick="startTimer()">Start</button>
                    <button class="btn-ghost" onclick="resetTimer()">Reset Timer</button>
                </div>
                <div class="timer-display" id="timer">00:00</div>
            </div>

            <div class="coin-flip panel draggable" data-section="coin-flip">
                <div class="drag-handle">⋮⋮</div>
                <div id="coin-result" class="coin-result"></div>
                <div class="coin" id="coin">🪙</div>
                <button class="btn-primary" onclick="flipCoin()">Flip Coin</button>
            </div>

            <div class="declare-winner panel draggable" id="declare-winner-box" data-section="declare-winner">
                <div class="drag-handle">⋮⋮</div>
                <div id="confetti-container"></div>
                <div class="section-heading">Declare Winner</div>
                <div class="winner-actions">
                    <button class="winner-btn btn-primary" onclick="declareWinner('Affirmative')">Affirmative</button>
                    <button class="winner-btn btn-primary" onclick="declareWinner('Negative')">Negative</button>
                </div>
            </div>

            <div class="vote-count panel quiet draggable" data-section="vote-count">
                <div class="drag-handle">⋮⋮</div>
                <h3>Pre-Debate Vote Count</h3>
                <div class="vote-row">
                    <button class="vote-btn btn-ghost" onclick="vote('pre-aff')">Affirmative</button>
                    <button class="vote-btn btn-ghost" onclick="vote('pre-neg')">Negative</button>
                </div>
                <p>Aff: <span id="pre-aff-count">0</span> | Neg: <span id="pre-neg-count">0</span></p>
                <h3>Post-Debate Vote Count</h3>
                <div class="vote-row">
                    <button class="vote-btn btn-ghost" onclick="vote('post-aff')">Affirmative</button>
                    <button class="vote-btn btn-ghost" onclick="vote('post-neg')">Negative</button>
                </div>
                <p>Aff: <span id="post-aff-count">0</span> | Neg: <span id="post-neg-count">0</span></p>
            </div>

            <div class="judges-section panel quiet draggable" data-section="judges">
                <div class="drag-handle">⋮⋮</div>
                <div class="judges-header">Judges' Decision</div>
                <div class="judge-row">
                    <input type="text" class="judge-name" placeholder="Judge 1 Name" id="judge1-name">
                    <div class="judge-decision">
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(1, 'aff')" id="judge1-aff">Aff</button>
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(1, 'neg')" id="judge1-neg">Neg</button>
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(1, 'draw')" id="judge1-draw">Draw</button>
                    </div>
                </div>
                <div class="judge-row">
                    <input type="text" class="judge-name" placeholder="Judge 2 Name" id="judge2-name">
                    <div class="judge-decision">
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(2, 'aff')" id="judge2-aff">Aff</button>
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(2, 'neg')" id="judge2-neg">Neg</button>
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(2, 'draw')" id="judge2-draw">Draw</button>
                    </div>
                </div>
                <div class="judge-row">
                    <input type="text" class="judge-name" placeholder="Judge 3 Name" id="judge3-name">
                    <div class="judge-decision">
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(3, 'aff')" id="judge3-aff">Aff</button>
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(3, 'neg')" id="judge3-neg">Neg</button>
                        <button class="decision-btn btn-ghost" onclick="setJudgeDecision(3, 'draw')" id="judge3-draw">Draw</button>
                    </div>
                </div>
                <div class="judges-result" id="judges-result"></div>
            </div>
        </div>
    </div>

    <script>
        let timer;
        let timeLeft = 0;
        let dingAudio = null;

        // GRID SNAP — panels stay on the 12-col CSS grid. Drag from the ⋮⋮ handle.
        const COLS = 12;
        const MAX_ROWS = 10;
        const LAYOUT_KEY = 'dashboardLayoutV2';
        const DEFAULT_LAYOUT = {
            participants: { col: 1, colSpan: 5, row: 1, rowSpan: 1 },
            resolution: { col: 6, colSpan: 7, row: 1, rowSpan: 1 },
            'debate-stage': { col: 1, colSpan: 4, row: 2, rowSpan: 2 },
            timer: { col: 5, colSpan: 3, row: 2, rowSpan: 1 },
            'coin-flip': { col: 8, colSpan: 2, row: 2, rowSpan: 1 },
            'declare-winner': { col: 10, colSpan: 3, row: 2, rowSpan: 1 },
            'vote-count': { col: 5, colSpan: 4, row: 3, rowSpan: 1 },
            judges: { col: 9, colSpan: 4, row: 3, rowSpan: 1 }
        };

        let drag = null;

        function gridPanels() {
            return Array.from(document.querySelectorAll('.dashboard-grid .draggable'));
        }

        function defaultPlace(section) {
            return Object.assign({}, DEFAULT_LAYOUT[section] || { col: 1, colSpan: 3, row: 1, rowSpan: 1 });
        }

        function readSaved() {
            try {
                return JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}');
            } catch (e) {
                return {};
            }
        }

        function isGridPlace(p) {
            return p && Number.isInteger(p.col) && Number.isInteger(p.row)
                && Number.isInteger(p.colSpan) && Number.isInteger(p.rowSpan);
        }

        function currentPlace(el) {
            const def = defaultPlace(el.dataset.section);
            const saved = readSaved()[el.dataset.section];
            if (isGridPlace(saved)) return Object.assign({}, def, saved);
            return def;
        }

        function applyPlacement(el, place) {
            el.classList.remove('dragging');
            el.style.position = '';
            el.style.left = '';
            el.style.top = '';
            el.style.width = '';
            el.style.height = '';
            el.style.zIndex = '';
            el.style.opacity = '';
            el.style.gridColumn = place.col + ' / span ' + place.colSpan;
            el.style.gridRow = place.row + ' / span ' + place.rowSpan;
        }

        function savePlace(section, place) {
            const all = readSaved();
            all[section] = {
                col: place.col,
                colSpan: place.colSpan,
                row: place.row,
                rowSpan: place.rowSpan
            };
            localStorage.setItem(LAYOUT_KEY, JSON.stringify(all));
            localStorage.removeItem('dashboardPositions');
        }

        function resetLayout() {
            localStorage.removeItem(LAYOUT_KEY);
            localStorage.removeItem('dashboardPositions');
            gridPanels().forEach(el => applyPlacement(el, defaultPlace(el.dataset.section)));
        }

        function loadLayout() {
            const saved = readSaved();
            gridPanels().forEach(el => {
                const place = isGridPlace(saved[el.dataset.section])
                    ? Object.assign(defaultPlace(el.dataset.section), saved[el.dataset.section])
                    : defaultPlace(el.dataset.section);
                applyPlacement(el, place);
            });
        }

        function overlaps(a, b) {
            return a.col < b.col + b.colSpan
                && a.col + a.colSpan > b.col
                && a.row < b.row + b.rowSpan
                && a.row + a.rowSpan > b.row;
        }

        function findSlotAgainst(wanted, occupancy) {
            const fits = (cand) => !occupancy.some(o => overlaps(cand, o));
            if (fits(wanted)) return wanted;

            let best = null;
            for (let row = 1; row <= MAX_ROWS - wanted.rowSpan + 1; row++) {
                for (let col = 1; col <= COLS - wanted.colSpan + 1; col++) {
                    const cand = {
                        col: col,
                        row: row,
                        colSpan: wanted.colSpan,
                        rowSpan: wanted.rowSpan
                    };
                    if (!fits(cand)) continue;
                    const d = Math.abs(col - wanted.col) + Math.abs(row - wanted.row) * 2;
                    if (!best || d < best.d) best = { d: d, cand: cand };
                }
            }
            return best ? best.cand : wanted;
        }

        function clearBumpPreview() {
            gridPanels().forEach(el => el.classList.remove('will-bump'));
        }

        function previewBumps(wanted, exceptEl) {
            gridPanels().forEach(el => {
                const hit = el !== exceptEl && overlaps(currentPlace(el), wanted);
                el.classList.toggle('will-bump', hit);
            });
        }

        function commitLayout(placements) {
            const all = {};
            placements.forEach(function(place, el) {
                applyPlacement(el, place);
                all[el.dataset.section] = {
                    col: place.col,
                    colSpan: place.colSpan,
                    row: place.row,
                    rowSpan: place.rowSpan
                };
            });
            localStorage.setItem(LAYOUT_KEY, JSON.stringify(all));
            localStorage.removeItem('dashboardPositions');
        }

        function dropAndBump(droppedEl, wanted) {
            const placements = new Map();
            placements.set(droppedEl, wanted);

            const occupancy = [wanted];
            const toBump = [];
            gridPanels().forEach(function(el) {
                if (el === droppedEl) return;
                const place = currentPlace(el);
                if (overlaps(place, wanted)) {
                    toBump.push(el);
                } else {
                    placements.set(el, place);
                    occupancy.push(place);
                }
            });

            toBump.forEach(function(el) {
                const old = currentPlace(el);
                const slot = findSlotAgainst(old, occupancy);
                placements.set(el, slot);
                occupancy.push(slot);
            });

            commitLayout(placements);
        }

        function gridMetrics() {
            const grid = document.querySelector('.dashboard-grid');
            const rect = grid.getBoundingClientRect();
            const styles = getComputedStyle(grid);
            const gap = parseFloat(styles.columnGap) || 16;
            const colW = (rect.width - gap * (COLS - 1)) / COLS;
            const rowH = Math.max(88, (rect.height - gap * 2) / 3);
            return { grid, rect, gap, colW, rowH };
        }

        function snapFromPoint(clientX, clientY, place) {
            const m = gridMetrics();
            let col = Math.round((clientX - m.rect.left + m.gap / 2) / (m.colW + m.gap)) + 1;
            let row = Math.round((clientY - m.rect.top + m.gap / 2) / (m.rowH + m.gap)) + 1;
            if (place.colSpan >= 12) col = 1;
            col = Math.max(1, Math.min(col, COLS - place.colSpan + 1));
            row = Math.max(1, Math.min(row, MAX_ROWS - place.rowSpan + 1));
            return { col, row, colSpan: place.colSpan, rowSpan: place.rowSpan };
        }

        function startDrag(e, el) {
            if (e.button !== 0) return;
            e.preventDefault();
            e.stopPropagation();
            const rect = el.getBoundingClientRect();
            drag = {
                el,
                offsetX: e.clientX - rect.left,
                offsetY: e.clientY - rect.top,
                place: currentPlace(el)
            };
            el.classList.add('dragging');
            el.style.width = rect.width + 'px';
            el.style.left = rect.left + 'px';
            el.style.top = rect.top + 'px';
            window.addEventListener('pointermove', onDragMove);
            window.addEventListener('pointerup', onDragUp, { once: true });
        }

        function onDragMove(e) {
            if (!drag) return;
            drag.el.style.left = (e.clientX - drag.offsetX) + 'px';
            drag.el.style.top = (e.clientY - drag.offsetY) + 'px';
            const wanted = snapFromPoint(e.clientX - drag.offsetX, e.clientY - drag.offsetY, drag.place);
            previewBumps(wanted, drag.el);
        }

        function onDragUp(e) {
            window.removeEventListener('pointermove', onDragMove);
            if (!drag) return;
            const { el, place, offsetX, offsetY } = drag;
            const wanted = snapFromPoint(e.clientX - offsetX, e.clientY - offsetY, place);
            clearBumpPreview();
            dropAndBump(el, wanted);
            drag = null;
        }

        document.addEventListener('DOMContentLoaded', function() {
            gridPanels().forEach(el => {
                const handle = el.querySelector('.drag-handle');
                if (!handle) return;
                handle.addEventListener('pointerdown', function(e) {
                    startDrag(e, el);
                });
            });
            loadLayout();
        });

        function playDing() {
            // Generate a simple beep using Web Audio API
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = 880; // A5 note
            gain.gain.value = 0.2;
            oscillator.connect(gain);
            gain.connect(ctx.destination);
            oscillator.start();
            setTimeout(() => {
                oscillator.stop();
                ctx.close();
            }, 350);
        }

        function startTimer() {
            clearInterval(timer);
            const minutes = parseInt(document.getElementById('timer-min').value) || 0;
            const seconds = parseInt(document.getElementById('timer-sec').value) || 0;
            timeLeft = minutes * 60 + seconds;
            timer = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                document.getElementById('timer').style.color = 'yellow';
                playDing();
            } else if (timeLeft <= 30) {
                document.getElementById('timer').style.color = 'red';
            } else if (timeLeft <= 60) {
                document.getElementById('timer').style.color = 'green';
            } else if (timeLeft <= 120) {
                document.getElementById('timer').style.color = 'orange';
            }
            timeLeft--;
        }

        function resetTimer() {
            clearInterval(timer);
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('timer').style.color = '#204e80';
            document.getElementById('timer-min').value = '';
            document.getElementById('timer-sec').value = '';
            timeLeft = 0;
        }

        let votes = { 'pre-aff': 0, 'pre-neg': 0, 'post-aff': 0, 'post-neg': 0 };

        function vote(type) {
            votes[type]++;
            document.getElementById(`${type}-count`).textContent = votes[type];
        }

        function declareWinner(side) {
            const box = document.getElementById('declare-winner-box');
            const confettiContainer = document.getElementById('confetti-container');
            confettiContainer.innerHTML = '';
            let emoji = side === 'Affirmative' ? '🏛️' : '⚔️';
            for (let i = 0; i < 8; i++) {
                const conf = document.createElement('span');
                conf.className = 'confetti';
                conf.style.left = (10 + Math.random() * 80) + '%';
                conf.style.animationDelay = (Math.random() * 0.3) + 's';
                conf.textContent = emoji;
                confettiContainer.appendChild(conf);
            }
            setTimeout(() => { confettiContainer.innerHTML = ''; }, 1400);
        }

        // JUDGES FUNCTIONALITY
        let judgeDecisions = { 1: null, 2: null, 3: null };

        function setJudgeDecision(judgeNum, decision) {
            // Remove selected class from all buttons for this judge
            document.getElementById(`judge${judgeNum}-aff`).classList.remove('selected');
            document.getElementById(`judge${judgeNum}-neg`).classList.remove('selected');
            document.getElementById(`judge${judgeNum}-draw`).classList.remove('selected');
            
            // Add selected class to clicked button
            document.getElementById(`judge${judgeNum}-${decision}`).classList.add('selected');
            
            // Store the decision
            judgeDecisions[judgeNum] = decision;
            
            // Calculate and display result
            calculateJudgesResult();
        }

        function calculateJudgesResult() {
            const decisions = Object.values(judgeDecisions);
            const affCount = decisions.filter(d => d === 'aff').length;
            const negCount = decisions.filter(d => d === 'neg').length;
            const drawCount = decisions.filter(d => d === 'draw').length;
            
            let result = '';
            
            if (affCount === 3) {
                result = 'Unanimous Decision: Affirmative Wins';
            } else if (negCount === 3) {
                result = 'Unanimous Decision: Negative Wins';
            } else if (affCount === 2 && drawCount === 1) {
                result = 'Majority Win: Affirmative Wins';
            } else if (negCount === 2 && drawCount === 1) {
                result = 'Majority Win: Negative Wins';
            } else if (affCount === 2 && negCount === 1) {
                result = 'Split Win: Affirmative Wins';
            } else if (negCount === 2 && affCount === 1) {
                result = 'Split Win: Negative Wins';
            } else if (affCount === 1 && drawCount === 2) {
                result = 'Majority Draw: Affirmative Wins';
            } else if (negCount === 1 && drawCount === 2) {
                result = 'Majority Draw: Negative Wins';
            } else if (drawCount === 3) {
                result = 'Draw: All Judges Declare Draw';
            } else if (affCount === 1 && negCount === 1 && drawCount === 1) {
                result = 'Split Decision: No Clear Winner';
            } else {
                result = 'Enter all judges\' decisions';
            }
            
            document.getElementById('judges-result').textContent = result;
        }

        // Add judges reset to resetAll function
        function resetAll() {
            votes = { 'pre-aff': 0, 'pre-neg': 0, 'post-aff': 0, 'post-neg': 0 };
            document.getElementById('pre-aff-count').textContent = '0';
            document.getElementById('pre-neg-count').textContent = '0';
            document.getElementById('post-aff-count').textContent = '0';
            document.getElementById('post-neg-count').textContent = '0';
            document.getElementById('timer').textContent = '00:00';
            clearInterval(timer);
            document.getElementById('timer').style.color = 'black';
            const resBox = document.getElementById('resolution-box');
            resBox.innerHTML = '<div class="drag-handle">⋮⋮</div>';
            resBox.classList.add('empty');
            document.getElementById('timer-min').value = '';
            document.getElementById('timer-sec').value = '';
            // Reset participant names
            document.getElementById('aff-name').value = '';
            document.getElementById('neg-name').value = '';
            updateParticipantDisplay();
            // Reset debate stage
            currentStage = 0;
            renderStages();
            // Reset coin flip
            const coin = document.getElementById('coin');
            coin.textContent = '🪙';
            coin.setAttribute('title', '');
            document.getElementById('coin-result').textContent = '';
            // Reset judges
            judgeDecisions = { 1: null, 2: null, 3: null };
            document.getElementById('judge1-name').value = '';
            document.getElementById('judge2-name').value = '';
            document.getElementById('judge3-name').value = '';
            document.getElementById('judge1-aff').classList.remove('selected');
            document.getElementById('judge1-neg').classList.remove('selected');
            document.getElementById('judge1-draw').classList.remove('selected');
            document.getElementById('judge2-aff').classList.remove('selected');
            document.getElementById('judge2-neg').classList.remove('selected');
            document.getElementById('judge2-draw').classList.remove('selected');
            document.getElementById('judge3-aff').classList.remove('selected');
            document.getElementById('judge3-neg').classList.remove('selected');
            document.getElementById('judge3-draw').classList.remove('selected');
            document.getElementById('judges-result').textContent = '';
            resetLayout();
            const resHandle = document.querySelector('#resolution-box .drag-handle');
            if (resHandle) {
                resHandle.addEventListener('pointerdown', function(e) {
                    startDrag(e, document.getElementById('resolution-box'));
                });
            }
        }

        // PARTICIPANT NAME LOGIC
        function updateParticipantDisplay() {
            document.getElementById('aff-name-display').textContent = document.getElementById('aff-name').value || 'Affirmative';
            document.getElementById('neg-name-display').textContent = document.getElementById('neg-name').value || 'Negative';
        }
        document.addEventListener('DOMContentLoaded', function() {
            const resBox = document.getElementById('resolution-box');
            function updatePlaceholder() {
                if (resBox.textContent.trim() === '') {
                    resBox.classList.add('empty');
                } else {
                    resBox.classList.remove('empty');
                }
            }
            resBox.addEventListener('input', updatePlaceholder);
            updatePlaceholder();
            document.getElementById('aff-name').addEventListener('input', updateParticipantDisplay);
            document.getElementById('neg-name').addEventListener('input', updateParticipantDisplay);
            updateParticipantDisplay();
        });

        // COIN FLIP LOGIC WITH RESULT TEXT
        function flipCoin() {
            const coin = document.getElementById('coin');
            const coinResult = document.getElementById('coin-result');
            coin.classList.remove('flipping');
            void coin.offsetWidth; // force reflow
            coin.classList.add('flipping');
            setTimeout(() => {
                const isHeads = Math.floor(Math.random() * 2) === 0;
                coin.textContent = isHeads ? '☀️' : '🌙';
                coin.setAttribute('title', isHeads ? 'Heads' : 'Tails');
                coin.classList.remove('flipping');
                coinResult.textContent = isHeads ? 'Heads!' : 'Tails!';
            }, 950);
        }

        // DEBATE STAGE LOGIC
        const debateStages = [
            'Pre-Debate Vote Count',
            'Affirmative Constructive Speech',
            'Negative Interpellation',
            'Negative Constructive Speech',
            'Affirmative Interpellation',
            'Questions from Judges',
            'Negative Closing Argument',
            'Affirmative Closing Argument',
            'Post-Debate Vote Count'
        ];
        let currentStage = 0;
        function renderStages() {
            const stageList = document.getElementById('stage-list');
            stageList.innerHTML = '';
            debateStages.forEach((stage, idx) => {
                const li = document.createElement('li');
                li.textContent = stage;
                li.className = idx === currentStage ? 'stage-current' : (idx < currentStage ? 'stage-complete' : '');
                stageList.appendChild(li);
            });
        }
        function changeStage(delta) {
            currentStage = Math.max(0, Math.min(debateStages.length - 1, currentStage + delta));
            renderStages();
        }
        document.addEventListener('DOMContentLoaded', function() {
            renderStages();
        });
    </script>
</body>
</html>
